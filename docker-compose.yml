# MuchToDo backend + MongoDB
#
# Used both locally (developer laptop) and on the backend EC2 instance.
# Values come from a `.env` file sitting next to this file; copy .env.example
# to .env and fill it in before running. Compose reads that file automatically.
#
#   docker compose up -d --build
#   docker compose ps
#   curl http://localhost:8080/health

services:
  # -------------------------------------------------------------------------
  # MongoDB
  # -------------------------------------------------------------------------
  # Runs as a SINGLE-NODE REPLICA SET, not a standalone server.
  #
  # Why: internal/handlers/user.go uses StartSession() + WithTransaction() for
  # the delete-user flow. MongoDB only permits multi-document transactions on a
  # replica set or a sharded cluster. Against a standalone mongod the API starts
  # cleanly and /health returns 200 - the failure only appears later, as
  # "Transaction numbers are only allowed on a replica set member or mongos".
  #
  # The replica set is initiated by the healthcheck below on first run, so no
  # manual `rs.initiate()` step is needed.
  mongodb:
    image: mongo:8.0
    container_name: muchtodo-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # NOTE: port 27017 is deliberately NOT published to the host.
    # MongoDB is reachable only from other services on the `appnet` network.
    # On EC2 this is reinforced by the MongoDB security group, which only
    # accepts 27017 from the backend security group.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set the first time it runs, then simply reports
      # status on every subsequent check.
      test: >
        mongosh --quiet --eval "
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok
          }
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - appnet

  # -------------------------------------------------------------------------
  # Backend API (Golang)
  # -------------------------------------------------------------------------
  backend:
    build:
      # Context is this directory, because the Dockerfile copies from the
      # much-to-do submodule at much-to-do/Server/MuchToDo/.
      context: .
      dockerfile: Dockerfile
    image: muchtodo-backend:latest
    container_name: muchtodo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # `mongodb` is the service name, resolved by Docker's internal DNS on the
      # appnet network. replicaSet=rs0 is required for transaction support.
      MONGO_URI: "mongodb://mongodb:27017/?replicaSet=rs0"
      DB_NAME: "${DB_NAME:-much_todo_db}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set - copy .env.example to .env}"
      JWT_EXPIRATION_HOURS: "${JWT_EXPIRATION_HOURS:-72}"
      # The Redis cache is optional in this application and is not part of the
      # assessment scope, so it stays off.
      ENABLE_CACHE: "false"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    depends_on:
      mongodb:
        # Waits for the replica set to be initiated and reporting healthy
        # before the API starts, rather than just for the container to exist.
        condition: service_healthy
    networks:
      - appnet

volumes:
  # Named volume: MongoDB data survives `docker compose down` and container
  # replacement. Removed only by `docker compose down -v`.
  mongo_data:
    driver: local

networks:
  appnet:
    driver: bridge
