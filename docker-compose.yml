# MuchToDo backend + MongoDB
#
#   docker compose up -d --build
#   docker compose ps
#   curl http://localhost:8080/health

services:
  # -------------------------------------------------------------------------
  # MongoDB
  # -------------------------------------------------------------------------
  # Runs as a SINGLE-NODE REPLICA SET, not a standalone server.
  #
  mongodb:
    image: mongo:8.0
    container_name: muchtodo-mongodb
    restart: unless-stopped

    command:
      [
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "0.25",
      ]

    volumes:
      - mongo_data:/data/db

    healthcheck:
      # Initiates the replica set the first time it runs, then simply reports
      # status on every subsequent check.
      test: >
        mongosh --quiet --eval "
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok
          }
        "
      interval: 60s
      timeout: 15s
      retries: 10
      # Gives mongod time to start and the replica set to elect a primary
      # before the first check counts against the retry budget.
      start_period: 90s

    networks:
      - appnet

  # -------------------------------------------------------------------------
  # Backend API (Golang)
  # -------------------------------------------------------------------------
  backend:
    build:
      # Context is this directory, because the Dockerfile copies from the
      # much-to-do submodule at much-to-do/Server/MuchToDo/.
      context: .
      dockerfile: Dockerfile
    image: muchtodo-backend:latest
    container_name: muchtodo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # `mongodb` is the service name, resolved by Docker's internal DNS on the
      # appnet network. replicaSet=rs0 is required for transaction support.
      MONGO_URI: "mongodb://mongodb:27017/?replicaSet=rs0"
      DB_NAME: "${DB_NAME:-much_todo_db}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set - copy .env.example to .env}"
      JWT_EXPIRATION_HOURS: "${JWT_EXPIRATION_HOURS:-72}"
      # The Redis cache is optional in this application and is not part of the
      # assessment scope, so it stays off.
      ENABLE_CACHE: "false"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    depends_on:
      mongodb:
        # Waits for the replica set to be initiated and reporting healthy
        # before the API starts, rather than just for the container to exist.
        condition: service_healthy
    networks:
      - appnet

volumes:
  # Named volume: MongoDB data survives `docker compose down` and container
  # replacement. Removed only by `docker compose down -v`.
  mongo_data:
    driver: local

networks:
  appnet:
    driver: bridge